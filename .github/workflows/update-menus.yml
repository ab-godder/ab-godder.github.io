name: Update menus

on:
  schedule:
    # Every 3 hours (UTC). Keeps "today" fresh shortly after Pacific midnight
    # and picks up menu changes the dining site posts during the day.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-menus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch menus
        run: python fetch_menus.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "Update menus $(TZ=America/Los_Angeles date +'%Y-%m-%d %H:%M')"
          git push
